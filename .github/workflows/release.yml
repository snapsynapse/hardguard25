name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify version strings match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          node scripts/check-release-versions.mjs "$TAG_VERSION"

  preflight:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"
          cache: false
      - name: Install deterministic check dependencies
        run: |
          npm ci
          python -m pip install pytest build
      - name: Run canonical repository verifier
        run: npm run verify

  publish-npm:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm for OIDC trusted publishing
        run: npm install -g npm@11.5.1
      - name: Publish to npm (trusted publishing, no token)
        working-directory: js
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "hardguard25@$VERSION" version >/dev/null 2>&1; then
            echo "hardguard25@$VERSION already exists; reconcile artifact identity before retrying" >&2
            exit 1
          else
            npm publish
          fi

  publish-pypi:
    needs: preflight
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install pytest build
          cd python && python -m pytest
      - name: Build
        working-directory: python
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: python/dist
          skip-existing: false

  tag-go:
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag Go submodule
        run: |
          GO_TAG="go/${GITHUB_REF_NAME}"
          TAG_STATE=$(node scripts/check-go-release-tag.mjs "$GO_TAG" "$GITHUB_SHA")
          if [ "$TAG_STATE" = matching ]; then
            echo "$GO_TAG already identifies the release commit"
            exit 0
          fi
          git tag "$GO_TAG" "$GITHUB_SHA"
          git push origin "$GO_TAG"
