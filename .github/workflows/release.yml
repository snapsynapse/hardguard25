name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify version strings match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          node scripts/check-release-versions.mjs "$TAG_VERSION"

  preflight:
    if: github.event_name == 'push'
    needs: verify
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"
          cache: false
      - name: Install deterministic check dependencies
        run: |
          npm ci
          python -m pip install pytest build
      - name: Build and verify exact release artifacts
        env:
          HG25_RELEASE_ARTIFACTS: ${{ github.workspace }}/release-artifacts
        run: npm run verify
      - name: Bind artifacts to reviewed source and commit
        id: manifest
        run: node scripts/check-release-artifacts.mjs write release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm for OIDC trusted publishing
        run: npm install -g npm@11.5.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts/
      - name: Verify and publish exact npm artifact
        env:
          HG25_EXPECTED_MANIFEST_SHA256: ${{ needs.preflight.outputs.manifest-sha256 }}
        run: |
          node scripts/check-release-artifacts.mjs verify release-artifacts
          node scripts/check-npm-release.mjs "${GITHUB_REF_NAME#v}"
          npm publish "./release-artifacts/hardguard25-${GITHUB_REF_NAME#v}.tgz" --ignore-scripts

  publish-pypi:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts/
      - name: Verify exact Python artifacts and select publication files
        env:
          HG25_EXPECTED_MANIFEST_SHA256: ${{ needs.preflight.outputs.manifest-sha256 }}
        run: |
          node scripts/check-release-artifacts.mjs verify release-artifacts
          mkdir python-publish
          cp release-artifacts/*.whl release-artifacts/*.tar.gz python-publish/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: python-publish
          skip-existing: false

  tag-go:
    if: github.event_name == 'push'
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag Go submodule
        run: |
          GO_TAG="go/${GITHUB_REF_NAME}"
          TAG_STATE=$(node scripts/check-go-release-tag.mjs "$GO_TAG" "$GITHUB_SHA")
          if [ "$TAG_STATE" = matching ]; then
            echo "$GO_TAG already identifies the release commit"
            exit 0
          fi
          git tag "$GO_TAG" "$GITHUB_SHA"
          git push origin "$GO_TAG"

  recover-npm-1-3-10:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9a76e7e94680da3b9e89410b073278e8ad62fa47
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm for OIDC trusted publishing
        run: npm install -g npm@11.5.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts/
          run-id: 44468122032
          github-token: ${{ github.token }}
      - name: Verify original artifact and publish npm
        env:
          HG25_TAG_COMMIT: 9a76e7e94680da3b9e89410b073278e8ad62fa47
          HG25_EXPECTED_MANIFEST_SHA256: 53a55b18232471c1bc32e89a031cff2df14d23b598ffe692e5f4823ca8feb00c
        run: |
          node --input-type=module -e 'import { verifyReleaseManifest } from "./scripts/check-release-artifacts.mjs"; verifyReleaseManifest(process.cwd(), "release-artifacts", process.env.HG25_TAG_COMMIT, process.env.HG25_EXPECTED_MANIFEST_SHA256)'
          node scripts/check-npm-release.mjs 1.3.10
          npm publish ./release-artifacts/hardguard25-1.3.10.tgz --ignore-scripts
