name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify version strings match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          node scripts/check-release-versions.mjs "$TAG_VERSION"

  preflight:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false
      - name: Install deterministic check dependencies
        run: |
          npm ci
          python -m pip install pytest build
      - name: Run canonical repository verifier
        run: npm run verify

  publish-npm:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm for OIDC trusted publishing
        run: npm install -g npm@11.5.1
      - name: Publish to npm (trusted publishing, no token)
        working-directory: js
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "hardguard25@$VERSION" version >/dev/null 2>&1; then
            echo "hardguard25@$VERSION already exists; skipping"
          else
            npm publish
          fi

  publish-pypi:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install pytest build
          cd python && python -m pytest
      - name: Build
        working-directory: python
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  tag-go:
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag Go submodule
        run: |
          GO_TAG="go/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/$GO_TAG" >/dev/null 2>&1; then
            echo "$GO_TAG already exists, skipping"
            exit 0
          fi
          git tag "$GO_TAG" "$GITHUB_SHA"
          git push origin "$GO_TAG"
