name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false
      - name: Install deterministic check dependencies
        run: |
          npm ci
          python -m pip install pytest build
      - name: Run canonical repository verifier
        run: npm run verify

  minimum-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"
          cache: false
      - name: Install Python test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Test JavaScript minimum runtime
        working-directory: js
        run: npm test
      - name: Test Python minimum runtime
        working-directory: python
        run: python -m pytest
      - name: Test Go minimum runtime
        working-directory: go
        run: go test ./...

  windows-python-artifact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python build dependency
        run: python -m pip install build
      - name: Verify exact wheel and sdist surfaces
        run: python scripts/check-python-package.py
